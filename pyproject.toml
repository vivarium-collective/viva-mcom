[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-mcom"
version = "0.1.0"
description = "Process-bigraph wrapper (clean-room reproduction) for the MCoM microbial community model"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    "numpy",
    "toml",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest", "plotly"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-mcom"
Issues = "https://github.com/vivarium-collective/viva-mcom/issues"
Upstream = "https://github.com/bgc-mod/MCoM"

[tool.hatch.build.targets.wheel]
packages = ["viva_mcom"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
